<div 
  class="flex flex-col items-center justify-center gap-4"
  [ngClass]="{
    'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm': fullScreen,
    'py-10': !fullScreen
  }"
>
  <div class="relative">
    <div class="absolute inset-0 rounded-full blur-xl opacity-40 bg-primary animate-pulse"></div>
    <div 
      class="rounded-full border-[3px] border-slate-200 dark:border-slate-700 border-t-primary animate-spin"
      [ngClass]="{
        'w-6 h-6': size === 'sm',
        'w-10 h-10': size === 'md',
        'w-16 h-16': size === 'lg'
      }"
    ></div>
  </div>
  <div class="text-center space-y-1">
    <p class="text-sm font-semibold text-slate-700 dark:text-slate-300 animate-pulse">
      {{ text }}
    </p>
    <span class="text-xs text-slate-400 tracking-wide">
      Procesando información...
    </span>
  </div>
</div>
