<div class="flex flex-col gap-8 animate-in fade-in duration-500">

  <!-- LOADING -->
  <app-loading 
    *ngIf="isLoading"
    [fullScreen]="true"
    text="Cargando factura...">
  </app-loading>

  <!-- HEADER -->
  <div class="flex flex-wrap items-center justify-between gap-4 p-4 bg-white/40 dark:bg-slate-800/40 backdrop-blur-md rounded-2xl border border-white/60 dark:border-slate-700/60 shadow-sm">
    
    <div class="flex items-center gap-6">
      <div class="flex flex-col">
        <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Documento No.</span>
        <div class="flex items-center gap-2">
          <span class="text-primary font-black text-xl tracking-tighter">FV-2026</span>
          <span class="text-slate-300 dark:text-slate-600 font-light text-xl">/</span>
          <span class="text-slate-900 dark:text-white font-black text-xl tracking-tighter">000124</span>
        </div>
      </div>

      <div class="h-10 w-px bg-slate-200 dark:bg-slate-700 mx-2"></div>

      <div class="flex flex-col">
        <span class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Estado</span>
        <span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-[10px] font-black uppercase bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 mt-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 dark:bg-emerald-400"></span> Borrador
        </span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="flex -space-x-2">
        <div class="size-8 rounded-full border-2 border-white dark:border-slate-900 bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-[10px] font-bold text-slate-500 shadow-sm">A</div>
        <div class="size-8 rounded-full border-2 border-white dark:border-slate-900 bg-emerald-500 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">V</div>
        <div class="size-8 rounded-full border-2 border-white dark:border-slate-900 bg-primary flex items-center justify-center text-[10px] font-bold text-white shadow-sm">E</div>
      </div>

      <button class="size-10 flex items-center justify-center text-slate-400 hover:text-primary hover:bg-white dark:hover:bg-slate-700 rounded-xl transition-all">
        <span class="material-symbols-outlined">more_vert</span>
      </button>
    </div>

  </div>

  <!-- GRID PRINCIPAL -->
  <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">

    <!-- 🟦 LEFT -->
    <div class="xl:col-span-3 space-y-8">

      <!-- FORM -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
        <app-voucher
          [title]="'Asiento Contable'"
          [voucher]="voucher"
          [voucherTypes]="voucherTypes">
        </app-voucher>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase text-slate-400">Fecha Emisión</label>
          <input type="date" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-2xl"/>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase text-slate-400">Cliente</label>
          <input type="text" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-2xl"/>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase text-slate-400">Vendedor</label>
          <select class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-2xl">
            <option>Administrador</option>
          </select>
        </div>

      </div>

      <!-- ENTRY TABLE -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
        <app-entry
          [title]="'Asiento Contable'"
          [data]="entries"
          (onAdd)="addEntry()"
          (onDelete)="deleteEntry($event)">
        </app-entry>
      </div>

    </div>

    <!-- 🟩 RIGHT -->
    <div class="xl:col-span-1 space-y-8 sticky top-6 h-fit">

      <!-- RESUMEN -->
      <div class="bg-primary text-white p-8 rounded-3xl shadow-2xl relative overflow-hidden">
        <h4 class="text-xs uppercase text-white/60 mb-4">Resumen</h4>

        <div class="space-y-3">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span>$1,200,000</span>
          </div>

          <div class="flex justify-between">
            <span>IVA</span>
            <span>$228,000</span>
          </div>

          <div class="border-t border-white/20 pt-3 flex justify-between text-lg font-bold">
            <span>Total</span>
            <span>$1,428,000</span>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="grid grid-cols-2 gap-4">
        <button class="p-4 bg-white dark:bg-slate-900 rounded-xl shadow">Contabilizar</button>
        <button class="p-4 bg-white dark:bg-slate-900 rounded-xl shadow">Imprimir</button>
        <button class="p-4 bg-white dark:bg-slate-900 rounded-xl shadow">Email</button>
        <button class="p-4 bg-white dark:bg-slate-900 rounded-xl shadow">Duplicar</button>
      </div>

    </div>

  </div>

</div>
